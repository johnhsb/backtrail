name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How Backtrail could help. Mockups and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or other tools that do this.
