#
# Backtrail GRUB configuration
#

search --file /REDO --set root
set prefix=($root)/boot/grub

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
loadfont pretendard-regular-16
loadfont pretendard-semibold-22
loadfont ascii

set default=0
set timeout=24
set gfxmode=auto
set gfxterm_font="Unifont Regular 16"
set theme=/boot/grub/theme/theme.txt

# Boot the 64-bit system on CPUs with long mode, otherwise the 32-bit one
if cpuid -l; then
    set redo_arch=amd64
    set redo_bits=64-bit
else
    set redo_arch=i386
    set redo_bits=32-bit
fi
export redo_arch
export redo_bits

menuentry "Backtrail $VERSION ($redo_bits)" --class backtrail {
    linux /live-${redo_arch}/vmlinuz boot=live live-media-path=/live-${redo_arch} \
        quiet splash noprompt nocomponents setkmap=us
    initrd /live-${redo_arch}/initrd
}

# Offer the 32-bit system on 64-bit BIOS machines as a fallback
# (UEFI firmware only loads the 64-bit system)
if [ "$grub_platform" = "pc" ]; then
    if [ "$redo_arch" = "amd64" ]; then
        menuentry "Backtrail $VERSION (32-bit)" --class backtrail {
            linux /live-i386/vmlinuz boot=live live-media-path=/live-i386 \
                quiet splash noprompt nocomponents setkmap=us
            initrd /live-i386/initrd
        }
    fi
fi

menuentry "Safe video mode" --class screen {
    linux /live-${redo_arch}/vmlinuz boot=live live-media-path=/live-${redo_arch} \
        quiet splash noprompt nocomponents nomodeset toram setkmap=us
    initrd /live-${redo_arch}/initrd
}
